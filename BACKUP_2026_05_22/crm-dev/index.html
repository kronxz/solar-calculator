<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM MF Soluções</title>

  <link rel="stylesheet" href="./css/global.css">
</head>

<body>

  <aside id="sidebar">
    <h2>⚡ MF CRM</h2>

    <button>Dashboard</button>
    <button>Leads</button>
    <button>Analytics</button>
  </aside>

  <main class="main-content">

    <h1>CRM MF Soluções</h1>

    <div id="dashboard">

      <div class="card">
        <h3>Total Leads</h3>
        <span id="totalLeads">0</span>
      </div>

      <div class="card">
        <h3>Em Negociação</h3>
        <span id="negociacao">0</span>
      </div>

      <div class="card">
        <h3>Fechados</h3>
        <span id="fechados">0</span>
      </div>

    </div>

    <div class="board">

      <div class="column" id="novo">
        <h2>🟡 Novos</h2>
      </div>

      <div class="column" id="contato">
        <h2>🔵 Contato</h2>
      </div>

      <div class="column" id="proposta">
        <h2>🟠 Proposta</h2>
      </div>

      <div class="column" id="fechado">
        <h2>🟢 Fechado</h2>
      </div>

    </div>

  </main>

  <div id="modalDetalhes" aria-hidden="true">
    <div class="modal-detalhes-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0;font-size:18px">📊 Detalhes</h2>
        <button type="button" id="btnFecharModal" style="width:auto;padding:8px 14px;background:#ef4444">Fechar</button>
      </div>
      <div id="modalDetalhesConteudo"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
