<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CRM - MF Soluções</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
margin:0;
padding:10px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.add{
background:#3b82f6;
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.board{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:10px;
}

.column{
min-width:260px;
background:#1f2937;
padding:10px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.column h2{
text-align:center;
font-size:15px;
margin-bottom:10px;
}

.card{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
animation:fadeIn 0.3s ease;
}

.card b{
font-size:16px;
}

.card small{
color:#9ca3af;
}

.whatsapp{
background:#22c55e;
}

.avancar{
background:#f59e0b;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>



<h1>⚡ MF Soluções - CRM</h1>

  

<!-- 🔥 DASHBOARD -->
<div id="dashboard" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">

  
  <div class="card">
    <b>💰 Em negociação</b><br>
    <span id="negociacao">R$ 0</span>
  </div>

  <div class="card">
    <b>🏆 Fechado</b><br>
    <span id="fechadoTotal">R$ 0</span>
  </div>

  <div class="card">
    <b>📊 Leads</b><br>
    <span id="totalLeads">0</span>
  </div>

  <div class="card">
    <b>📈 Conversão</b><br>
    <span id="conversao">0%</span>
  </div>

</div>

  <canvas id="graficoLeads" style="margin-top:20px;"></canvas>

  
<button class="add" onclick="novoLead()">+ Novo Lead</button>

<div class="board">

<div class="column" id="novo">
<h2>🟡 Novos</h2>
</div>

<div class="column" id="contato">
<h2>🔵 Contato</h2>
</div>

<div class="column" id="proposta">
<h2>🟠 Proposta</h2>
</div>

<div class="column" id="fechado">
<h2>🟢 Fechado</h2>
</div>

</div>

<script>

let leads = []

function salvar(){
render()
}


function detalhes(lead){

alert(
"Cliente: " + lead.nome + "\n\n" +
"Telefone: " + lead.telefone + "\n" +
"Endereço: " + (lead.endereco || "-") + "\n\n" +
"Conta: R$ " + lead.valor + "\n\n" +

"Sistema: " + (lead.sistema || "Simulação") + "\n" +
"Potência: " + (lead.kwp || "-") + " kWp\n" +
"Módulos: " + (lead.placas || "-") + "\n" +
"Potência módulo: " + (lead.potenciaPlaca || "-") + " W\n" +
"Economia: R$ " + (lead.economia || "-") + "\n" +
"Investimento: R$ " + (lead.investimento || "-") + "\n\n" +

"Data: " + lead.data
)

}

let grafico

function atualizarGrafico(){

let contagem = {
  novo: 0,
  contato: 0,
  proposta: 0,
  fechado: 0
}

leads.forEach(l => {
  if(contagem[l.status] !== undefined){
    contagem[l.status]++
  }
})

let dados = [
  contagem.novo,
  contagem.contato,
  contagem.proposta,
  contagem.fechado
]

if(grafico){
  grafico.destroy()
}

let ctx = document.getElementById("graficoLeads").getContext("2d")

grafico = new Chart(ctx, {
  type: "bar",
  data: {
    labels: ["Novos", "Contato", "Proposta", "Fechado"],
    datasets: [{
      label: "Leads",
      data: dados
    }]
  }
})

}

function novoLead(){

let nome = prompt("Nome do cliente:")
if(!nome) return

let telefone = prompt("Telefone (com DDD):")
let valor = prompt("Conta de luz (R$):")

leads.push({
id: Date.now(),
nome,
telefone,
valor,
status:"novo"
})

salvar()
}

window.mover = async function(id){

let lead = leads.find(l => l.id == id)

let ordem = ["novo","contato","proposta","fechado"]

let i = ordem.indexOf(lead.status)

if(i < ordem.length -1){

let novoStatus = ordem[i+1]

// 🔥 ATUALIZA NO FIREBASE
const ref = doc(db, "leads", id)

await updateDoc(ref, {
  status: novoStatus
})

}

}

function whatsapp(telefone,nome){

let msg = "Olá "+nome+"! Vi sua simulação solar e vou te ajudar com seu projeto."

window.open("https://wa.me/"+telefone+"?text="+encodeURIComponent(msg))

}

function render(){

document.getElementById("novo").innerHTML="<h2>🟡 Novo</h2>"
document.getElementById("contato").innerHTML="<h2>🔵 Contato</h2>"
document.getElementById("proposta").innerHTML="<h2>🟠 Proposta</h2>"
document.getElementById("fechado").innerHTML="<h2>🟢 Fechado</h2>"

leads.forEach(l => {

let card = `
<div class="card">

<b>${l.nome}</b><br>
<small>📞 ${l.telefone}</small><br>
<small>💡 Conta: R$ ${l.valor}</small>

<button onclick='detalhes(${JSON.stringify(l)})'>
📊 Detalhes
</button>

<button class="whatsapp" onclick="whatsapp('${l.telefone}','${l.nome}')">
💬 WhatsApp
</button>

<button class="avancar" onclick="mover('${l.id}')">
➡️ Avançar etapa
</button>

<button style="background:#ef4444" onclick="excluir('${l.id}')">
🗑 Excluir
</button>

<button onclick='abrirProposta(${JSON.stringify(l)})'>
📄 Gerar Proposta
</button>

</div>
`

document.getElementById(l.status).innerHTML += card

 
})
  
atualizarDashboard()
atualizarGrafico()

}

render()

function abrirProposta(lead){

localStorage.setItem("propostaAtual", JSON.stringify(lead))

window.open("../proposta.html", "_blank")

}

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8OBOl1hUfsrWWT0-L19uuI-F273IvBgU",
  authDomain: "mf-solucoes-crm.firebaseapp.com",
  projectId: "mf-solucoes-crm",
  storageBucket: "mf-solucoes-crm.firebasestorage.app",
  messagingSenderId: "492242482187",
  appId: "1:492242482187:web:c5d808bf46d199bc60030e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db
window.doc = doc
window.updateDoc = updateDoc
window.deleteDoc = deleteDoc

onSnapshot(collection(db, "leads"), (snapshot) => {

  leads = [] // limpa lista

  snapshot.forEach(doc => {
    leads.push({
      id: doc.id,
      ...doc.data()
    })
  })

  render()

})

window.excluir = async function(id){

let confirmar = confirm("Deseja excluir este lead?")

if(!confirmar) return

// 🔥 REMOVE DO FIREBASE
const ref = doc(db, "leads", id)

await deleteDoc(ref)

}

</script>

</body>
</html>
