<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CRM - MF Soluções</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
margin:0;
padding:10px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.add{
background:var(--azul-principal);
color:black;
margin-bottom:10px;
}

.detalhes{
  background:#0ea5e9;
  color:white;
}



.proposta:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(37,99,235,0.4);
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.board{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:10px;
}



.column{
min-width:260px;
background:#1f2937;
padding:10px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.column h2{
text-align:center;
font-size:15px;
margin-bottom:10px;
}

.card{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
animation:fadeIn 0.3s ease;
}

.card b{
font-size:16px;
}

.card small{
color:#9ca3af;
}

.whatsapp{
background:#22c55e;
}

.avancar{
background:#f59e0b;
}

.excluir{
  background:#ef4444;
  color:white;
}

button.proposta{
  background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
  color: white !important;
  font-weight: 600;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>



<h1>⚡ MF Soluções - CRM</h1>

  

<!-- 🔥 DASHBOARD -->
<div id="dashboard" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">

  
  <div class="card">
    <b>💰 Em negociação</b><br>
    <span id="negociacao">R$ 0</span>
  </div>

  <div class="card">
    <b>🏆 Fechado</b><br>
    <span id="fechadoTotal">R$ 0</span>
  </div>

  <div class="card">
    <b>📊 Leads</b><br>
    <span id="totalLeads">0</span>
  </div>

  <div class="card">
    <b>📈 Conversão</b><br>
    <span id="conversao">0%</span>
  </div>

</div>

  <canvas id="graficoLeads" style="margin-top:20px;"></canvas>

  
<button class="add" onclick="novoLead()">+ Novo Lead</button>

<div class="board">

<div class="column" id="novo" ondragover="allowDrop(event)" ondrop="drop(event, 'novo')">
<h2>🟡 Novos</h2>
</div>

<div class="column" id="contato" ondragover="allowDrop(event)" ondrop="drop(event, 'contato')">
<h2>🔵 Contato</h2>
</div>

<div class="column" id="proposta" ondragover="allowDrop(event)" ondrop="drop(event, 'proposta')">
<h2>🟠 Proposta</h2>
</div>

<div class="column" id="fechado" ondragover="allowDrop(event)" ondrop="drop(event, 'fechado')">
<h2>🟢 Fechado</h2>
</div>

</div>

<script>



</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8OBOl1hUfsrWWT0-L19uuI-F273IvBgU",
  authDomain: "mf-solucoes-crm.firebaseapp.com",
  projectId: "mf-solucoes-crm",
  storageBucket: "mf-solucoes-crm.firebasestorage.app",
  messagingSenderId: "492242482187",
  appId: "1:492242482187:web:c5d808bf46d199bc60030e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let leads = []

function drag(ev, id){
  ev.dataTransfer.setData("id", id)
}

function allowDrop(ev){
  ev.preventDefault()
}


window.drop = async function(ev, novoStatus){

  ev.preventDefault()

  let id = ev.dataTransfer.getData("id")

  const ref = doc(db, "leads", id)

  await updateDoc(ref, {
    status: novoStatus
  })

}

window.whatsapp = function(telefone,nome){

  let numero = telefone.replace(/\D/g,'')

  let msg = "Olá "+nome+"! Vi sua simulação solar."

  window.open("https://wa.me/55"+numero+"?text="+encodeURIComponent(msg))

}
window.verDetalhes = function(lead){

  alert(`
👤 Cliente: ${lead.nome}

📞 Telefone: ${lead.telefone || "Não informado"}
📍 Endereço: ${lead.endereco || "Não informado"}

⚡ Sistema: ${lead.sistema || "-"}
🔋 Potência: ${lead.kwp || "-"} kWp
🔢 Módulos: ${lead.placas || "-"}

💰 Economia: R$ ${lead.economia || "-"}
💵 Investimento: R$ ${lead.investimento || "-"}
  `)

}
window.mover = async function(id){

  let lead = leads.find(l => l.id == id)

  let ordem = ["novo","contato","proposta","fechado"]
  let i = ordem.indexOf(lead.status)

  if(i < ordem.length -1){

    let novoStatus = ordem[i+1]

    const ref = doc(db, "leads", id)

    await updateDoc(ref, {
      status: novoStatus
    })
  }
}

window.excluir = async function(id){

  if(!confirm("Excluir lead?")) return

  const ref = doc(db, "leads", id)

  await deleteDoc(ref)
}

window.abrirProposta = function(id){

  let lead = leads.find(l => l.id == id)

  localStorage.setItem("propostaAtual", JSON.stringify(lead))

  window.open("../proposta.html", "_blank")

}
  
function formatarData(data){

let d = new Date(data)

return d.toLocaleDateString("pt-BR") + " " + 
       d.toLocaleTimeString("pt-BR", {
         hour: '2-digit',
         minute: '2-digit'
       })

}


function diasPassados(data){
  let hoje = new Date()
  let criado = new Date(data)
  let diff = hoje - criado
  return Math.floor(diff / (1000 * 60 * 60 * 24))
}

function render(){

  document.getElementById("novo").innerHTML="<h2>🟡 Novos</h2>"
  document.getElementById("contato").innerHTML="<h2>🔵 Contato</h2>"
  document.getElementById("proposta").innerHTML="<h2>🟠 Proposta</h2>"
  document.getElementById("fechado").innerHTML="<h2>🟢 Fechado</h2>"

  leads.forEach(l => {

let dias = diasPassados(l.data)

let alerta = ""
let cor = ""

if(dias >= 5){
  alerta = "🔥 URGENTE"
  cor = "#ef4444"
}
else if(dias >= 2){
  alerta = "⚠️ Esfriando"
  cor = "#f59e0b"
}
else{
  alerta = "🟢 Novo"
  cor = "#22c55e"
}
  let card = `
<div class="card" draggable="true" ondragstart="drag(event, '${l.id}')">

<b>${l.nome}</b><br>
<small>📞 ${l.telefone}</small><br>
<small>💡 Conta: R$ ${l.valor}</small><br>
<small>📅 ${formatarData(l.data)}</small>

<small style="
color:${cor};
font-weight:700;
background:rgba(0,0,0,0.2);
padding:3px 6px;
border-radius:6px;
display:inline-block;
">
${alerta}
</small><br>


<button class="whatsapp" onclick="whatsapp('${l.telefone}','${l.nome}')">
💬 WhatsApp
</button>

<button onclick="mover('${l.id}')">
➡️ Avançar
</button>

<button class="excluir" onclick="excluir('${l.id}')">
🗑 Excluir
</button>

<button class="detalhes" onclick="verDetalhes(${JSON.stringify(l).replace(/"/g, '&quot;')})">
📊 Detalhes
</button>

<button class="proposta" onclick="abrirProposta('${l.id}')">
📄 Proposta
</button>

</div>
`

    document.getElementById(l.status).innerHTML += card
  })
}

window.novoLead = async function(){

  let nome = prompt("Nome do cliente:")
  if(!nome) return

  let telefone = prompt("Telefone:")
 let valor = prompt("Conta de luz:")
let investimento = prompt("Valor do sistema (R$):")

await addDoc(collection(db, "leads"), {
  nome,
  telefone,
  valor,
  investimento,
  status: "novo",
  data: new Date().toISOString()
})

}

onSnapshot(collection(db, "leads"), (snapshot) => {

  leads = []

  snapshot.forEach(doc => {
    leads.push({
      id: doc.id,
      ...doc.data()
    })
  })
// 🔥 CALCULAR MÉTRICAS CORRETAMENTE

let total = leads.length

let negociacao = leads.filter(l => 
  l.status === "contato" || l.status === "proposta"
)
let fechado = leads.filter(l => l.status === "fechado")

let valorNegociacao = negociacao.reduce((acc, l) => acc + (parseFloat(l.valor) || 0), 0)
let valorFechado = fechado.reduce((acc, l) => {
  return acc + (parseFloat(l.investimento) || 0)
}, 0)

let conversao = total > 0 ? ((fechado.length / total) * 100).toFixed(0) : 0

// 🔥 ATUALIZA UI COM SEGURANÇA
const elNeg = document.getElementById("negociacao")
const elFech = document.getElementById("fechadoTotal")
const elLeads = document.getElementById("totalLeads")
const elConv = document.getElementById("conversao")

if(elNeg) elNeg.innerText = "R$ " + valorNegociacao
if(elFech) elFech.innerText = "R$ " + valorFechado
if(elLeads) elLeads.innerText = total
if(elConv) elConv.innerText = conversao + "%"
  render()
})
  
window.db = db
window.doc = doc
window.updateDoc = updateDoc
window.deleteDoc = deleteDoc



</script>

</body>
</html>
