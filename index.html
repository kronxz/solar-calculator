<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF Soluções Elétricas e Energia Solar</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
background:#22c55e;
font-weight:bold;
cursor:pointer;
}

.card{
background:#1f2937;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.recommended{
border:2px solid #22c55e;
}

.resultTitle{
font-weight:bold;
font-size:18px;
margin-bottom:5px;
}

</style>

</head>

<body>

<div style="text-align:center;margin-bottom:20px;">
<img src="logo.jpg" width="220">
</div>

<h1>☀️ Simulador Solar - MF Soluções</h1>
<p>Descubra quanto você pode economizar com energia solar em Maricá</p>

<h2>Dados do Cliente</h2>

<input type="text" id="clienteNome" placeholder="Nome do cliente">

<input type="tel" id="clienteTelefone" placeholder="Telefone / WhatsApp">

<h2>Consumo</h2>

Conta de luz (R$)
<input id="bill" type="number" placeholder="Ex: 350">

Tarifa (R$/kWh)
<input id="tariff" value="0.95">

Cidade
<select id="city">
<option value="4.8">Rio de Janeiro</option>
<option value="4.3">São Paulo</option>
<option value="5.5">Brasília</option>
<option value="5.0">Belo Horizonte</option>
<option value="5.3">Salvador</option>
</select>

<button onclick="calc()">Simular Sistema</button>

<div id="result"></div>

<script>

function inverterSuggestion(kwp){

if(kwp<=3) return "3 kW"
if(kwp<=5) return "5 kW"
if(kwp<=8) return "8 kW"
if(kwp<=10) return "10 kW"

return "15 kW"

}

function systemCard(name,kwp,hsp,tariff){

let panels=Math.ceil((kwp*1000)/575)

let generation=kwp*hsp*30

let saving=generation*tariff

let investment=kwp*2500

let payback=investment/(saving*12)

let inverter=inverterSuggestion(kwp)

return `

<div class="card ${name=="Recomendado ⭐"?"recommended":""}">

<div class="resultTitle">${name}</div>

${panels} módulos<br>

${kwp.toFixed(2)} kWp<br>

Geração: ${generation.toFixed(0)} kWh/mês<br>

Economia mensal: R$ ${saving.toFixed(0)}<br>

Economia anual: R$ ${(saving*12).toFixed(0)}<br>

Economia 25 anos: R$ ${(saving*12*25).toFixed(0)}<br>

Investimento: R$ ${investment.toFixed(0)}<br>

Payback: ${payback.toFixed(1)} anos<br>

Inversor sugerido: ${inverter}

<br><br>

<button onclick="enviarKit('${name}',${kwp.toFixed(2)},${panels},${saving.toFixed(0)})">
Escolher este sistema
</button>

</div>

`

}

function calc(){

let bill=parseFloat(document.getElementById("bill").value)

let tariff=parseFloat(document.getElementById("tariff").value)

let hsp=parseFloat(document.getElementById("city").value)

let consumption=bill/tariff

let perdas=0.75

let baseKwp=consumption/(hsp*30*perdas)

let essential=baseKwp*0.8

let recommended=baseKwp

let premium=baseKwp*1.3

let html=""

html+=systemCard("Essencial",essential,hsp,tariff)

html+=systemCard("Recomendado ⭐",recommended,hsp,tariff)

html+=systemCard("Premium",premium,hsp,tariff)

document.getElementById("result").innerHTML=html

}

function enviarKit(nomeSistema,kwp,placas,economia){

let nome=document.getElementById("clienteNome").value
let telefone=document.getElementById("clienteTelefone").value

let mensagem=
"Olá "+nome+" 👋\n\n"+
"Segue a simulação do seu sistema solar.\n\n"+
"🔆 Sistema: "+nomeSistema+"\n"+
"⚡ Potência: "+kwp+" kWp\n"+
"🔋 Módulos: "+placas+"\n"+
"💰 Economia mensal: R$ "+economia+"\n\n"+
"Esse sistema pode reduzir sua conta de luz em até 90%."

let url="https://wa.me/"+telefone+"?text="+encodeURIComponent(mensagem)

window.open(url)

}

</script>

</body>
</html>
