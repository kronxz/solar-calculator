<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF Soluções Elétricas e Energia Solar</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
background:#22c55e;
font-weight:bold;
cursor:pointer;
}

.card{
background:#1f2937;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.recommended{
border:2px solid #22c55e;
}

.resultTitle{
font-weight:bold;
font-size:18px;
margin-bottom:5px;
}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>

<div style="text-align:center;margin-bottom:20px;">
<img src="logo.jpg" width="220">
</div>

<h1>☀️ Simulador Solar - MF Soluções</h1>
<p>Descubra quanto você pode economizar com energia solar em Maricá</p>

<h2>Dados do Cliente</h2>

<input type="text" id="clienteNome" placeholder="Nome do cliente">

<input type="tel" id="clienteTelefone" placeholder="Telefone / WhatsApp">

<input type="text" id="endereco" placeholder="Endereço da instalação">

<button onclick="verTelhado()">Ver telhado no mapa 🛰</button>

<h2>Consumo</h2>

Conta de luz (R$)
<input id="bill" type="number" placeholder="Ex: 350">

Tarifa (R$/kWh)
<input id="tariff" value="0.95">

Cidade
<select id="city">
<option value="4.8">Rio de Janeiro</option>
<option value="4.3">São Paulo</option>
<option value="5.5">Brasília</option>
<option value="5.0">Belo Horizonte</option>
<option value="5.3">Salvador</option>
</select>

Potência do módulo
<select id="potenciaPlaca">
<option value="620">620 W</option>
<option value="700" selected>700 W</option>
</select>

<button onclick="calc()">Simular Sistema</button>

<div id="result"></div>

<script>

function inverterSuggestion(kwp){

if(kwp<=3) return "3 kW"
if(kwp<=5) return "5 kW"
if(kwp<=8) return "8 kW"
if(kwp<=10) return "10 kW"

return "15 kW"

}
function precoPorKwp(kwp){

if(kwp <= 4){
return 3900
}

if(kwp <= 8){
return 3500
}

return 3100

}  

function verTelhado(){

let endereco=document.getElementById("endereco").value

if(endereco==""){
alert("Digite o endereço para visualizar o telhado.")
return
}

let mapa="https://www.google.com/maps/search/"+encodeURIComponent(endereco)


window.open(mapa,"_blank")

}

function calculateInvestment(kwp){

if(kwp <= 4){
return kwp * 4200
}

if(kwp <= 8){
return kwp * 3900
}

return kwp * 3500

}


function systemCard(name,kwp,hsp,tariff,potenciaPlaca){

let bill = parseFloat(document.getElementById("bill").value)

let panels = Math.ceil((kwp*1000)/potenciaPlaca)

let generation = kwp*hsp*30

let saving = Math.min(generation * tariff, bill * 0.9)

let investment = calculateInvestment(kwp)

let payback = investment / (saving*12)

let inverter = inverterSuggestion(kwp)

return `

<div class="card ${name=="Recomendado ⭐"?"recommended":""}">



<div class="resultTitle">${name}</div>

${panels} módulos<br>
Potência do módulo: ${potenciaPlaca} W<br>

${kwp.toFixed(2)} kWp<br>

Geração: ${generation.toFixed(0)} kWh/mês<br>

Economia mensal: R$ ${saving.toFixed(0)}<br>
Economia anual: R$ ${(saving*12).toFixed(0)}<br>
Economia 25 anos: R$ ${(saving*12*25).toFixed(0)}<br>

Investimento: R$ ${investment.toFixed(0)}<br>
Payback: ${payback.toFixed(1)} anos<br>

Inversor sugerido: ${inverter}

<br><br>

<br>


<button onclick="enviarKit('${name}',${kwp.toFixed(2)},${panels},${saving.toFixed(0)})">
Escolher este sistema
</button>

<button onclick="gerarProposta('${name}',${kwp.toFixed(2)},${panels},${saving.toFixed(0)})">
Gerar proposta detalhada 📄
</button>

</div>

`
}
  
function calc(){

let nome = document.getElementById("clienteNome").value
let telefone = document.getElementById("clienteTelefone").value

// 🔒 BLOQUEIO (obrigar preencher)
if(nome === "" || telefone === ""){
alert("Preencha nome e telefone primeiro")
return
}

let bill = parseFloat(document.getElementById("bill").value)

if(!bill || bill <= 0){
alert("Digite o valor da conta de luz")
return
}

let tariff = parseFloat(document.getElementById("tariff").value)

let hsp = parseFloat(document.getElementById("city").value)

let potenciaPlaca = parseFloat(document.getElementById("potenciaPlaca").value)

let consumption = bill / tariff

let perdas = 0.80

let baseKwp = consumption / (hsp * 30 * perdas)

let essential = baseKwp * 0.8

let recommended = baseKwp

let premium = baseKwp * 1.3

let html = ""

html += systemCard("Essencial",essential,hsp,tariff,potenciaPlaca)
html += systemCard("Recomendado ⭐",recommended,hsp,tariff,potenciaPlaca)
html += systemCard("Premium",premium,hsp,tariff,potenciaPlaca)

document.getElementById("result").innerHTML = html

}

function enviarKit(nomeSistema,kwp,placas,economia){

let nome=document.getElementById("clienteNome").value
let telefone=document.getElementById("clienteTelefone").value
let endereco=document.getElementById("endereco").value
let bill=document.getElementById("bill").value


// SALVAR LEAD NO CRM

let potenciaPlaca = document.getElementById("potenciaPlaca").value

let leads = JSON.parse(localStorage.getItem("leads")) || []

leads.push({
id: Date.now(),
nome,
telefone,
endereco,
valor: bill,
sistema: nomeSistema,
kwp,
placas,
potenciaPlaca,
economia,
investimento: (kwp * 3200).toFixed(0),
status: "novos",
tipo: "escolhido",
data: new Date().toLocaleString()
})

localStorage.setItem("leads", JSON.stringify(leads))

localStorage.setItem("leads", JSON.stringify(leads))
  
let seuNumero="5521972381004"

let mensagem=
"Olá, sou "+nome+"\n\n"+
"Acabei de fazer uma simulação de energia solar.\n\n"+
"Telefone: "+telefone+"\n"+
(endereco ? "Endereço: "+endereco+"\n" : "")+
"Conta de luz: R$ "+bill+"\n\n"+
"Sistema escolhido: "+nomeSistema+"\n"+
"Potência: "+kwp+" kWp\n"+
"Módulos: "+placas+"\n"+
"Potência do módulo: "+potenciaPlaca+" W\n"+
"Economia mensal: R$ "+economia+"\n\n"+
(endereco ? "Mapa da instalação:\nhttps://www.google.com/maps/search/"+encodeURIComponent(endereco)+"\n\n" : "")+
"Gostaria de falar sobre esse projeto."

let url="https://wa.me/"+seuNumero+"?text="+encodeURIComponent(mensagem)

window.open(url,"_blank")

}

function gerarProposta(nomeSistema, kwp, placas, economia){

let nome = document.getElementById("clienteNome").value
let telefone = document.getElementById("clienteTelefone").value
let endereco = document.getElementById("endereco").value
let bill = document.getElementById("bill").value
let potenciaPlaca = document.getElementById("potenciaPlaca").value

let leads = JSON.parse(localStorage.getItem("leads")) || []

leads.push({
id: Date.now(),
nome,
telefone,
endereco,
valor: bill,
sistema: nomeSistema,
kwp,
placas,
potenciaPlaca,
economia,
status: "proposta",
data: new Date().toLocaleString()
})

localStorage.setItem("leads", JSON.stringify(leads))

alert("Simulação salva! Em breve entraremos em contato com sua proposta.")

}

</script>

</body>
</html>
