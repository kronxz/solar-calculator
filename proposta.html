<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proposta Solar</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family: Arial;
background:#f5f5f5;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:800px;
margin:auto;
}

h2{
  text-align:center;
  margin-top:20px;
}

  .pagina{
  width:800px;
  margin:40px auto;
  background:white;
  padding:40px;
  border-radius:10px;
  page-break-after:always;
}

h1{
  margin-bottom:10px;
}
.capa{
  text-align:center;
}

.capa h1{
  font-size:28px;
  color:#0f172a;
}

.capa h2{
  font-size:18px;
  color:#334155;
}
  
</style>

</head>

<body>

<div class="pagina capa">

  <img src="logo.png" style="width:120px; display:block; margin:auto;">

  <h1 style="text-align:center;">Proposta Comercial</h1>
  <h2 style="text-align:center;">Energia Solar Fotovoltaica</h2>

  <p><strong>Cliente:</strong> <span id="clienteNome"></span></p>
  <p><strong>Cidade:</strong> <span id="cidade"></span></p>
  <p><strong>Telefone:</strong> <span id="telefone"></span></p>

</div>


<div class="pagina sistema">

  <h2>Resumo do Sistema</h2>

  <div id="dados"></div>

  <canvas id="grafico"></canvas>

</div>

<script>

let dados = JSON.parse(localStorage.getItem("propostaAtual"))

document.getElementById("clienteNome").innerText = dados.nome
document.getElementById("cidade").innerText = dados.cidade || "Não informado"
document.getElementById("telefone").innerText = dados.telefone || "Não informado"

  let economia = dados.economia
let investimento = dados.kwp * 3500

let payback = investimento / (economia*12)

document.getElementById("dados").innerHTML = `
<p><strong>Cliente:</strong> ${dados.nome}</p>
<p><strong>Sistema:</strong> ${dados.sistema}</p>
<p><strong>Potência:</strong> ${dados.kwp} kWp</p>
<p><strong>Módulos:</strong> ${dados.placas}</p>
<p><strong>Economia mensal:</strong> R$ ${economia}</p>
<p><strong>Investimento:</strong> R$ ${investimento.toFixed(0)}</p>
<p><strong>Payback:</strong> ${payback.toFixed(1)} anos</p>
`

new Chart(document.getElementById("grafico"), {
type: 'bar',
data: {
labels: Array.from({length:25},(_,i)=>i+1),
datasets: [{
label: 'Fluxo de Caixa',
data: Array.from({length:25},(_,i)=> economia*12*(i+1) - investimento)
}]
}
})
setTimeout(() => {
  window.print()
}, 1000)
  
</script>

</body>
</html>
